<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<title>cube overlay</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="overlay.css">
</head>
<body>
<div id="root" data-theme="dark">
  <div class="wrap">
    <div class="brand">
      <span>cube</span>
      <span class="brand-sub" id="sess-count">0</span>
    </div>
    <div class="rows" id="rows"></div>
    <div class="divider"></div>
    <div class="usage" id="usage-row" hidden>
      <span>Use</span>
      <div class="bar"><div class="bar-fill" id="bar-fill"></div></div>
      <span id="usage-pct" class="tabular">0%</span>
    </div>
    <div class="entity-wrap" id="entity-wrap" hidden>
      <canvas class="entity" id="cube-entity"></canvas>
    </div>
  </div>
</div>
<script src="cube-entity.js"></script>
<script src="overlay.js"></script>
</body>
</html>
